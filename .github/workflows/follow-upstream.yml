name: Follow upstream

# Merge the latest official release every day. The push starts the Windows build.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A personal token: the default one can neither push workflow files nor start the build.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Merge the latest release
        run: |
          upstream=https://github.com/desktop/desktop.git
          tag=$(git ls-remote --tags --refs "$upstream" 'release-*' | sed 's|.*refs/tags/||' |
            grep -E '^release-[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          git fetch --no-tags "$upstream" "refs/tags/$tag:refs/tags/$tag"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already on $tag"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$tag"
          git push origin HEAD
